# ==============================================================================
# Chocolate Shop Management System - Application Configuration
# ==============================================================================
spring.application.name=chocolate-shop
server.port=${SERVER_PORT:8080}

# ==============================================================================
# PostgreSQL Datasource Configuration (Configured with Environment Variables)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chocolate_shop}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Quanfey}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# Spring Data JPA / Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ==============================================================================
# Thymeleaf Configuration
# ==============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.chocolateshop=INFO
