<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::#categories-content}, 'Chocolate Categories', 'categories')}">
<body>
<div id="categories-content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="h3 fw-bold text-dark mb-1">Chocolate Categories</h2>
            <p class="text-muted small mb-0">Organize retail products into consumer classifications (Milk, Dark, Pralines, Gift Boxes).</p>
        </div>
        <button type="button" class="btn btn-artisan" data-bs-toggle="modal" data-bs-target="#newCategoryModal">
            <i class="bi bi-plus-circle me-1"></i> Add Category
        </button>
    </div>

    <!-- Categories Table -->
    <div class="card border-0 shadow-sm p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Category Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="5" class="text-center py-4 text-muted">No categories defined yet.</td>
                    </tr>
                    <tr th:each="cat : ${categories}">
                        <td th:text="${cat.id}">1</td>
                        <td><strong th:text="${cat.name}">Milk Chocolate</strong></td>
                        <td class="text-muted" th:text="${cat.description}">Description</td>
                        <td>
                            <span th:if="${cat.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                            <span th:if="${cat.status.name() == 'INACTIVE'}" class="badge bg-secondary">INACTIVE</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{'/categories/toggle/' + ${cat.id}}" method="post" class="d-inline" onsubmit="return confirm('Toggle status for this category?');">
                                <button type="submit" class="btn btn-sm" th:classappend="${cat.status.name() == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'">
                                    <i th:class="${cat.status.name() == 'ACTIVE'} ? 'bi bi-slash-circle' : 'bi bi-check-circle'"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div class="modal fade" id="newCategoryModal" tabindex="-1" aria-labelledby="newCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/categories/save}" th:object="${newCategory}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="newCategoryModalLabel">Add Chocolate Category</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Category Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Handmade Pralines, Seasonal Truffles" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Brief classification description..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-artisan">Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
