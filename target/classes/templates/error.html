<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${theme}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Chocolate Shop Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:replace="~{layout :: theme-init}"></script>
</head>
<body class="app-shell d-flex flex-column min-vh-100">

    <nav class="navbar artisan-navbar py-2">
        <div class="container">
            <a class="navbar-brand fs-5" th:href="@{/dashboard}">
                <img th:src="@{/images/jaha_logo_transparent.png}" alt="JaHa Logo" class="jaha-admin-logo">
            </a>
            <div th:replace="~{layout :: theme-control}"></div>
        </div>
    </nav>

    <div class="container my-auto py-5 text-center">
        <div class="card shadow-sm border-0 mx-auto p-4" style="max-width: 520px; border-radius: var(--radius-md);">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle display-1"></i>
            </div>
            <h2 class="fw-bold mb-2" th:text="${errorTitle != null ? errorTitle : 'Unexpected Error'}">Notice</h2>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested operation could not be completed.'}">
                An issue was encountered while processing your request.
            </p>
            <div>
                <a th:href="@{/dashboard}" class="btn btn-artisan">
                    <i class="bi bi-house-door me-1"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <small>&copy; 2026 JaHa Management</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:replace="~{layout :: common-script}"></script>
</body>
</html>
