<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::#expenses-content}, 'Operating Expenses', 'expenses')}">
<body>
<div id="expenses-content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="h3 fw-bold text-dark mb-1">Operating Expenses</h2>
            <p class="text-muted small mb-0">Record shop rent, electricity, packaging, marketing, and confectionery overheads.</p>
        </div>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-artisan" data-bs-toggle="modal" data-bs-target="#newExpenseModal">
                <i class="bi bi-plus-circle me-1"></i> Record Expense
            </button>
            <a th:href="@{/expenses/categories}" class="btn btn-outline-secondary">
                <i class="bi bi-bookmark-fill me-1"></i> Expense Categories
            </a>
        </div>
    </div>

    <!-- Filter Form -->
    <div class="card border-0 shadow-sm p-3 mb-4">
        <form method="get" th:action="@{/expenses}" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small fw-semibold text-muted mb-1">Category</label>
                <select name="categoryId" class="form-select form-select-sm">
                    <option value="">All Categories</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == categoryId}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold text-muted mb-1">Payment Method</label>
                <select name="paymentMethod" class="form-select form-select-sm">
                    <option value="">All Methods</option>
                    <option th:each="m : ${paymentMethods}" th:value="${m}" th:text="${m}" th:selected="${m == paymentMethod}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold text-muted mb-1">From Date</label>
                <input type="date" name="startDate" class="form-control form-control-sm" th:value="${startDate}">
            </div>
            <div class="col-md-2">
                <label class="form-label small fw-semibold text-muted mb-1">To Date</label>
                <input type="date" name="endDate" class="form-control form-control-sm" th:value="${endDate}">
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-choco flex-fill">Filter</button>
                <a th:href="@{/expenses}" class="btn btn-sm btn-outline-secondary">Clear</a>
            </div>
        </form>
    </div>

    <!-- Expenses Table -->
    <div class="card border-0 shadow-sm p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Payment Method</th>
                        <th class="text-end">Amount</th>
                        <th>Recorded By</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${expensePage.empty}">
                        <td colspan="7" class="text-center py-4 text-muted">No expense records found.</td>
                    </tr>
                    <tr th:each="exp : ${expensePage.content}">
                        <td th:text="${exp.expenseDate}">2026-10-05</td>
                        <td><span class="badge bg-light text-dark border" th:text="${exp.category.name}">Rent</span></td>
                        <td th:text="${exp.description}">Description</td>
                        <td><span class="badge bg-secondary text-uppercase" th:text="${exp.paymentMethod}">CASH</span></td>
                        <td class="text-end fw-bold text-danger" th:text="'$' + ${#numbers.formatDecimal(exp.amount, 1, 2)}">$0.00</td>
                        <td th:text="${exp.recordedBy != null ? exp.recordedBy.username : 'admin'}">admin</td>
                        <td class="text-end">
                            <form th:action="@{'/expenses/delete/' + ${exp.id}}" method="post" class="d-inline" onsubmit="return confirm('Delete this expense?');">
                                <button type="submit" class="btn btn-sm text-danger p-0"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal fade" id="newExpenseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/expenses/save}" th:object="${newExpense}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold">Record Operating Expense</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Expense Category <span class="text-danger">*</span></label>
                            <select th:field="*{category}" class="form-select" required>
                                <option value="">-- Choose Category --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Amount ($) <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{amount}" class="form-control" step="0.01" min="0.01" placeholder="0.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Expense Date <span class="text-danger">*</span></label>
                            <input type="date" th:field="*{expenseDate}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Payment Method <span class="text-danger">*</span></label>
                            <select th:field="*{paymentMethod}" class="form-select" required>
                                <option th:each="m : ${paymentMethods}" th:value="${m}" th:text="${m}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description / Purpose</label>
                            <textarea th:field="*{description}" class="form-control" rows="2" placeholder="e.g. Monthly rent, light bill..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-artisan">Save Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
