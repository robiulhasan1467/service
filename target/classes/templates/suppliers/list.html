<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::#suppliers-list-content}, 'Supplier Directory', 'suppliers')}">
<body>
<div id="suppliers-list-content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="h3 fw-bold text-dark mb-1">Suppliers & Vendors</h2>
            <p class="text-muted small mb-0">Manage chocolate cocoa suppliers, packaging vendors, and purchase accounts.</p>
        </div>
        <a th:href="@{/suppliers/new}" class="btn btn-artisan">
            <i class="bi bi-person-plus me-1"></i> Add Supplier
        </a>
    </div>

    <!-- Search Box -->
    <div class="card border-0 shadow-sm p-3 mb-4">
        <form method="get" th:action="@{/suppliers}" class="row g-2">
            <div class="col-md-9">
                <input type="text" name="query" class="form-control" placeholder="Search by name, company, or phone..." th:value="${query}">
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-choco flex-fill">Search</button>
                <a th:href="@{/suppliers}" class="btn btn-outline-secondary">Clear</a>
            </div>
        </form>
    </div>

    <!-- Suppliers Table -->
    <div class="card border-0 shadow-sm p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Supplier / Contact</th>
                        <th>Company</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Opening Due</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(suppliers)}">
                        <td colspan="7" class="text-center py-4 text-muted">No suppliers found.</td>
                    </tr>
                    <tr th:each="s : ${suppliers}">
                        <td><strong class="text-dark" th:text="${s.name}">Name</strong></td>
                        <td th:text="${s.companyName}">Company</td>
                        <td th:text="${s.phone}">Phone</td>
                        <td th:text="${s.email}">Email</td>
                        <td th:text="'$' + ${#numbers.formatDecimal(s.openingDue, 1, 2)}">$0.00</td>
                        <td>
                            <span th:if="${s.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                            <span th:if="${s.status.name() == 'INACTIVE'}" class="badge bg-secondary">INACTIVE</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/suppliers/view/' + ${s.id}}" class="btn btn-sm btn-outline-primary" title="View Statement">
                                <i class="bi bi-eye"></i> Statement
                            </a>
                            <a th:href="@{'/suppliers/edit/' + ${s.id}}" class="btn btn-sm btn-outline-secondary ms-1" title="Edit Supplier">
                                <i class="bi bi-pencil"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
