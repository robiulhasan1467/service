<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::#purchase-form-content}, 'New Purchase Order', 'purchases-new')}">
<body>
<div id="purchase-form-content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="h3 fw-bold text-dark mb-1">Create Purchase Order</h2>
            <p class="text-muted small mb-0">Record supplier purchase invoices. Confirmed orders automatically replenish product inventory.</p>
        </div>
        <a th:href="@{/purchases}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Order History
        </a>
    </div>

    <div class="card border-0 shadow-sm p-4">
        <form th:action="@{/purchases/save}" th:object="${purchaseRequest}" method="post" id="purchaseForm">
            
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Supplier <span class="text-danger">*</span></label>
                    <select th:field="*{supplierId}" class="form-select" required>
                        <option value="">-- Choose Supplier --</option>
                        <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name} + ' (' + ${s.companyName} + ')'"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Paid Amount ($)</label>
                    <input type="number" th:field="*{paidAmount}" class="form-control" step="0.01" min="0" placeholder="Amount paid at purchase">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Order Notes / External Supplier Reference</label>
                    <input type="text" th:field="*{notes}" class="form-control" placeholder="e.g. Shipment airway bill #, supplier packing slip ref...">
                </div>
            </div>

            <!-- Items Table -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="fw-bold mb-0">Purchase Order Line Items</h5>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addPurchaseRow()">
                    <i class="bi bi-plus-lg me-1"></i> Add Another Item
                </button>
            </div>

            <div class="table-responsive mb-4 border rounded p-2 bg-white">
                <table class="table table-bordered align-middle mb-0" id="purchaseItemsTable">
                    <thead class="table-light">
                        <tr>
                            <th style="min-width: 250px;">Product</th>
                            <th style="width: 140px;">Quantity</th>
                            <th style="width: 150px;">Unit Cost ($)</th>
                            <th style="width: 150px;">Line Total ($)</th>
                            <th style="width: 60px;"></th>
                        </tr>
                    </thead>
                    <tbody id="purchaseItemsBody">
                        <tr class="purchase-row">
                            <td>
                                <select name="items[0].productId" class="form-select form-select-sm product-select" required onchange="handleProductChange(this)">
                                    <option value="">-- Select Product --</option>
                                    <option th:each="p : ${products}" th:value="${p.id}" th:data-cost="${p.purchasePrice}" th:text="${p.name} + ' (' + ${p.sku} + ')'"></option>
                                </select>
                            </td>
                            <td>
                                <input type="number" name="items[0].quantity" class="form-control form-control-sm qty-input" value="10" min="1" step="1" required oninput="calculateRowTotal(this)">
                            </td>
                            <td>
                                <input type="number" name="items[0].unitPrice" class="form-control form-control-sm cost-input" value="0.00" min="0" step="0.01" required oninput="calculateRowTotal(this)">
                            </td>
                            <td>
                                <input type="text" class="form-control form-control-sm line-total" value="$0.00" readonly>
                            </td>
                            <td class="text-center">
                                <button type="button" class="btn btn-sm text-danger" onclick="removePurchaseRow(this)"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/purchases}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-artisan px-4">
                    <i class="bi bi-check-circle me-1"></i> Confirm & Restock Inventory
                </button>
            </div>
        </form>
    </div>

    <!-- Script to dynamically add/remove rows and compute totals -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        let rowCount = 1;

        function handleProductChange(select) {
            const cost = select.options[select.selectedIndex].getAttribute('data-cost');
            const row = select.closest('tr');
            if (cost) {
                row.querySelector('.cost-input').value = parseFloat(cost).toFixed(2);
            }
            calculateRowTotal(select);
        }

        function calculateRowTotal(elem) {
            const row = elem.closest('tr');
            const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
            const cost = parseFloat(row.querySelector('.cost-input').value) || 0;
            const total = qty * cost;
            row.querySelector('.line-total').value = '$' + total.toFixed(2);
        }

        function addPurchaseRow() {
            const tbody = document.getElementById('purchaseItemsBody');
            const template = tbody.querySelector('.purchase-row');
            const newRow = template.cloneNode(true);

            newRow.querySelector('.product-select').name = `items[${rowCount}].productId`;
            newRow.querySelector('.product-select').selectedIndex = 0;
            newRow.querySelector('.qty-input').name = `items[${rowCount}].quantity`;
            newRow.querySelector('.qty-input').value = '10';
            newRow.querySelector('.cost-input').name = `items[${rowCount}].unitPrice`;
            newRow.querySelector('.cost-input').value = '0.00';
            newRow.querySelector('.line-total').value = '$0.00';

            tbody.appendChild(newRow);
            rowCount++;
        }

        function removePurchaseRow(btn) {
            const tbody = document.getElementById('purchaseItemsBody');
            if (tbody.querySelectorAll('.purchase-row').length > 1) {
                btn.closest('tr').remove();
            } else {
                alert("Purchase order must have at least one product row.");
            }
        }
        /*]]>*/
    </script>

</div>
</body>
</html>
