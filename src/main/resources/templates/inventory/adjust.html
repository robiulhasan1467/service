<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::#adjust-content}, 'Manual Stock Adjustment', 'inventory-adjust')}">
<body>
<div id="adjust-content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="h3 fw-bold text-dark mb-1">Manual Stock Adjustment</h2>
            <p class="text-muted small mb-0">Record physical count reconciliations, spoiled batches, or damaged inventory with audit notes.</p>
        </div>
        <a th:href="@{/inventory/stock}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Stock
        </a>
    </div>

    <div class="card border-0 shadow-sm p-4" style="max-width: 640px; margin: 0 auto;">
        <form th:action="@{/inventory/adjust}" th:object="${adjustmentDto}" method="post">
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Select Chocolate Product <span class="text-danger">*</span></label>
                <select th:field="*{productId}" class="form-select" required>
                    <option value="">-- Choose Product --</option>
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name} + ' (In-Stock: ' + ${p.stockQuantity} + ' ' + ${p.unit} + ')'"></option>
                </select>
                <div th:if="${#fields.hasErrors('productId')}" th:errors="*{productId}" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Adjustment Type <span class="text-danger">*</span></label>
                <select th:field="*{adjustmentType}" class="form-select" required>
                    <option value="DAMAGE">DAMAGE (Deducts spoiled / damaged stock)</option>
                    <option value="ADJUSTMENT">ADJUSTMENT (Sets new physical recount total)</option>
                    <option value="OPENING_STOCK">OPENING_STOCK (Adds initial baseline inventory)</option>
                </select>
                <div th:if="${#fields.hasErrors('adjustmentType')}" th:errors="*{adjustmentType}" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Quantity <span class="text-danger">*</span></label>
                <input type="number" th:field="*{quantity}" class="form-control" step="1" min="1" placeholder="Enter quantity" required>
                <div class="form-text">For DAMAGE, enter quantity damaged. For ADJUSTMENT, enter verified on-shelf stock count.</div>
                <div th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="text-danger small mt-1"></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Audit Reason / Note</label>
                <textarea th:field="*{note}" class="form-control" rows="3" placeholder="e.g. Broken package during transit, shelf temperature deviation..."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/inventory/stock}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-warning text-dark fw-bold px-4">
                    <i class="bi bi-check-circle me-1"></i> Commit Stock Adjustment
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
