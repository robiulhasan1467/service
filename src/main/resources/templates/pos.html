<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::#pos-content}, 'Point of Sale (POS)', 'pos')}">
<body>
<div id="pos-content">

    <div class="row g-3">
        <!-- LEFT: Product Search, Category Filter, and Product Grid -->
        <div class="col-lg-7 col-xl-8">
            <div class="card border-0 shadow-sm p-3 mb-3">
                <!-- Barcode & Search Input -->
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-8">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="bi bi-upc-scan text-muted"></i>
                            </span>
                            <input type="text" id="posSearchInput" class="form-control border-start-0 ps-0"
                                   placeholder="Scan barcode or search chocolate by name / SKU (Press Enter to add)..." autofocus>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select id="posCategoryFilter" class="form-select">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
                        </select>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="row g-2 overflow-auto" style="max-height: calc(100vh - 220px);" id="productsGrid">
                    <div th:each="p : ${products}"
                         class="col-6 col-md-4 col-xl-3 product-item"
                         th:data-id="${p.id}"
                         th:data-name="${p.name}"
                         th:data-sku="${p.sku}"
                         th:data-price="${p.effectivePrice}"
                         th:data-stock="${p.stockQuantity}"
                         th:data-category-id="${p.category != null ? p.category.id : ''}">
                        
                        <div class="card h-100 pos-product-card border p-2 position-relative"
                             style="cursor: pointer; border-radius: var(--radius-sm);"
                             onclick="addToCart(this)">
                            
                            <!-- Stock Badge -->
                            <span th:if="${p.stockQuantity <= 0}" class="badge bg-danger position-absolute top-0 end-0 m-2">Out of Stock</span>
                            <span th:if="${p.stockQuantity > 0 && p.isLowStock()}" class="badge bg-warning text-dark position-absolute top-0 end-0 m-2">
                                Low: <span th:text="${p.stockQuantity}"></span>
                            </span>
                            <span th:if="${p.stockQuantity > p.minStockLevel}" class="badge bg-light text-muted border position-absolute top-0 end-0 m-2">
                                Stock: <span th:text="${p.stockQuantity}"></span>
                            </span>

                            <div class="text-center py-2">
                                <span class="fs-1">🍫</span>
                            </div>
                            <div class="card-body p-1 text-center">
                                <h6 class="card-title fw-bold mb-1 text-truncate" th:text="${p.name}">Product Name</h6>
                                <small class="text-muted d-block mb-1" th:text="${p.sku}">SKU</small>
                                <div class="fw-bold text-choco fs-6" th:text="'$' + ${#numbers.formatDecimal(p.effectivePrice, 1, 2)}">$0.00</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: Cart & Checkout Register -->
        <div class="col-lg-5 col-xl-4">
            <div class="card border-0 shadow-sm p-3 h-100 d-flex flex-column">
                
                <!-- Customer Selection -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted mb-1">
                        <i class="bi bi-person me-1"></i> Customer Selection
                    </label>
                    <div class="input-group">
                        <select id="cartCustomerId" class="form-select">
                            <option th:each="c : ${customers}"
                                    th:value="${c.id}"
                                    th:text="${c.name} + (${c.isWalkIn} ? ' (Default)' : ' - ' + ${c.phone})"
                                    th:selected="${c.isWalkIn}">Customer</option>
                        </select>
                        <a th:href="@{/customers/new}" class="btn btn-outline-secondary" title="Add New Customer" target="_blank">
                            <i class="bi bi-plus-lg"></i>
                        </a>
                    </div>
                </div>

                <!-- Cart Items Table -->
                <div class="flex-grow-1 overflow-auto border rounded mb-3 p-2 bg-white" style="min-height: 220px; max-height: 280px;">
                    <table class="table table-sm align-middle mb-0" id="cartTable">
                        <thead class="table-light">
                            <tr>
                                <th>Item</th>
                                <th style="width: 85px;">Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cartTableBody">
                            <!-- Items injected dynamically by JS -->
                            <tr id="emptyCartRow">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="bi bi-cart3 fs-2 d-block mb-1"></i>
                                    Cart is empty. Select products to begin.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Summary Breakdown -->
                <div class="bg-light p-3 rounded mb-3">
                    <div class="d-flex justify-content-between mb-1 small">
                        <span class="text-muted">Subtotal:</span>
                        <strong id="summarySubtotal">$0.00</strong>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-1 small">
                        <span class="text-muted">Discount ($):</span>
                        <input type="number" id="cartDiscount" class="form-control form-control-sm text-end w-25" value="0.00" min="0" step="0.5">
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-1 small">
                        <span class="text-muted">Tax / VAT ($):</span>
                        <input type="number" id="cartTax" class="form-control form-control-sm text-end w-25" value="0.00" min="0" step="0.5">
                    </div>
                    <hr class="my-2">
                    <div class="d-flex justify-content-between align-items-center fs-5">
                        <span class="fw-bold">Grand Total:</span>
                        <strong class="text-choco fw-bolder fs-4" id="summaryGrandTotal">$0.00</strong>
                    </div>
                </div>

                <!-- Payment Details -->
                <div class="mb-3">
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-muted mb-1">Payment Method</label>
                            <select id="cartPaymentMethod" class="form-select form-select-sm">
                                <option value="CASH">CASH</option>
                                <option value="CARD">CARD</option>
                                <option value="BKASH">bKash</option>
                                <option value="NAGAD">Nagad</option>
                                <option value="BANK">BANK</option>
                                <option value="MIXED">MIXED PAYMENT</option>
                                <option value="OTHER">OTHER</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-muted mb-1">Amount Paid ($)</label>
                            <input type="number" id="cartPaidAmount" class="form-control form-control-sm text-end fw-bold" value="0.00" min="0" step="1">
                        </div>
                    </div>

                    <!-- Quick Cash Tender Shortcuts -->
                    <div class="d-flex gap-1 mb-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="setQuickCash('exact')">Exact</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="setQuickCash(10)">$10</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="setQuickCash(20)">$20</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="setQuickCash(50)">$50</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="setQuickCash(100)">$100</button>
                    </div>

                    <!-- Change / Due Indicator -->
                    <div class="d-flex justify-content-between align-items-center p-2 rounded bg-light border">
                        <span class="small fw-semibold text-muted" id="changeOrDueLabel">Change:</span>
                        <span class="fw-bold fs-6 text-success" id="summaryChangeOrDue">$0.00</span>
                    </div>
                </div>

                <!-- Submit Checkout Form (Hidden Form submitted via JS) -->
                <form id="posCheckoutForm" th:action="@{/pos/checkout}" method="post">
                    <input type="hidden" name="customerId" id="formCustomerId">
                    <input type="hidden" name="discount" id="formDiscount" value="0.00">
                    <input type="hidden" name="tax" id="formTax" value="0.00">
                    <input type="hidden" name="paidAmount" id="formPaidAmount" value="0.00">
                    <input type="hidden" name="paymentMethod" id="formPaymentMethod" value="CASH">
                    <div id="hiddenCartItemsContainer"></div>

                    <button type="button" id="btnCompleteSale" class="btn btn-artisan btn-lg w-100 py-3 shadow" onclick="submitPosSale()">
                        <i class="bi bi-printer-fill me-2"></i> Complete & Print Invoice
                    </button>
                </form>

            </div>
        </div>
    </div>

    <!-- POS Client Script -->
    <script>
        let cart = [];

        function addToCart(cardElement) {
            const id = parseInt(cardElement.getAttribute('data-id'));
            const name = cardElement.getAttribute('data-name');
            const sku = cardElement.getAttribute('data-sku');
            const price = parseFloat(cardElement.getAttribute('data-price'));
            const stock = parseFloat(cardElement.getAttribute('data-stock'));

            if (stock <= 0) {
                alert("This product is currently out of stock!");
                return;
            }

            const existingIndex = cart.findIndex(item => item.id === id);
            if (existingIndex > -1) {
                if (cart[existingIndex].quantity + 1 > stock) {
                    alert("Cannot add more: Available stock is " + stock);
                    return;
                }
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({
                    id: id,
                    name: name,
                    sku: sku,
                    price: price,
                    quantity: 1,
                    stock: stock
                });
            }

            renderCart();
        }

        function updateQty(id, change) {
            const index = cart.findIndex(item => item.id === id);
            if (index > -1) {
                const newQty = cart[index].quantity + change;
                if (newQty <= 0) {
                    cart.splice(index, 1);
                } else if (newQty > cart[index].stock) {
                    alert("Cannot add more: Available stock is " + cart[index].stock);
                    return;
                } else {
                    cart[index].quantity = newQty;
                }
                renderCart();
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            renderCart();
        }

        function renderCart() {
            const tbody = document.getElementById('cartTableBody');
            tbody.innerHTML = '';

            if (cart.length === 0) {
                tbody.innerHTML = `
                    <tr id="emptyCartRow">
                        <td colspan="5" class="text-center py-5 text-muted">
                            <i class="bi bi-cart3 fs-2 d-block mb-1"></i>
                            Cart is empty. Select products to begin.
                        </td>
                    </tr>
                `;
                calculateTotals();
                return;
            }

            cart.forEach(item => {
                const lineTotal = item.price * item.quantity;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <strong class="d-block text-truncate" style="max-width: 130px;">${item.name}</strong>
                        <small class="text-muted">${item.sku}</small>
                    </td>
                    <td>
                        <div class="input-group input-group-sm">
                            <button class="btn btn-outline-secondary px-1" type="button" onclick="updateQty(${item.id}, -1)">-</button>
                            <input type="text" class="form-control text-center px-1" value="${item.quantity}" readonly>
                            <button class="btn btn-outline-secondary px-1" type="button" onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </td>
                    <td>$${item.price.toFixed(2)}</td>
                    <td><strong>$${lineTotal.toFixed(2)}</strong></td>
                    <td class="text-end">
                        <button class="btn btn-sm text-danger p-0" onclick="removeFromCart(${item.id})">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            calculateTotals();
        }

        function calculateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const discount = parseFloat(document.getElementById('cartDiscount').value) || 0;
            const tax = parseFloat(document.getElementById('cartTax').value) || 0;
            const grandTotal = Math.max(0, subtotal - discount + tax);

            document.getElementById('summarySubtotal').innerText = '$' + subtotal.toFixed(2);
            document.getElementById('summaryGrandTotal').innerText = '$' + grandTotal.toFixed(2);

            const paidInput = document.getElementById('cartPaidAmount');
            const paid = parseFloat(paidInput.value) || 0;

            const changeLabel = document.getElementById('changeOrDueLabel');
            const changeDisplay = document.getElementById('summaryChangeOrDue');

            if (paid >= grandTotal) {
                const change = paid - grandTotal;
                changeLabel.innerText = 'Change:';
                changeLabel.className = 'small fw-semibold text-muted';
                changeDisplay.innerText = '$' + change.toFixed(2);
                changeDisplay.className = 'fw-bold fs-6 text-success';
            } else {
                const due = grandTotal - paid;
                changeLabel.innerText = 'Customer Due:';
                changeLabel.className = 'small fw-semibold text-danger';
                changeDisplay.innerText = '$' + due.toFixed(2);
                changeDisplay.className = 'fw-bold fs-6 text-danger';
            }
        }

        function setQuickCash(amount) {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const discount = parseFloat(document.getElementById('cartDiscount').value) || 0;
            const tax = parseFloat(document.getElementById('cartTax').value) || 0;
            const grandTotal = Math.max(0, subtotal - discount + tax);

            if (amount === 'exact') {
                document.getElementById('cartPaidAmount').value = grandTotal.toFixed(2);
            } else {
                document.getElementById('cartPaidAmount').value = parseFloat(amount).toFixed(2);
            }
            calculateTotals();
        }

        function submitPosSale() {
            if (cart.length === 0) {
                alert("Please add at least one item to the cart before checkout.");
                return;
            }

            const customerId = document.getElementById('cartCustomerId').value;
            const discount = document.getElementById('cartDiscount').value;
            const tax = document.getElementById('cartTax').value;
            const paid = document.getElementById('cartPaidAmount').value;
            const paymentMethod = document.getElementById('cartPaymentMethod').value;

            document.getElementById('formCustomerId').value = customerId;
            document.getElementById('formDiscount').value = discount;
            document.getElementById('formTax').value = tax;
            document.getElementById('formPaidAmount').value = paid;
            document.getElementById('formPaymentMethod').value = paymentMethod;

            const container = document.getElementById('hiddenCartItemsContainer');
            container.innerHTML = '';

            cart.forEach((item, index) => {
                container.innerHTML += `
                    <input type="hidden" name="items[${index}].productId" value="${item.id}">
                    <input type="hidden" name="items[${index}].quantity" value="${item.quantity}">
                    <input type="hidden" name="items[${index}].unitPrice" value="${item.price}">
                    <input type="hidden" name="items[${index}].discount" value="0.00">
                `;
            });

            document.getElementById('btnCompleteSale').disabled = true;
            document.getElementById('btnCompleteSale').innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Processing...`;
            document.getElementById('posCheckoutForm').submit();
        }

        // Live Search & Category Filtering
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('posSearchInput');
            const categoryFilter = document.getElementById('posCategoryFilter');
            const discountInput = document.getElementById('cartDiscount');
            const taxInput = document.getElementById('cartTax');
            const paidInput = document.getElementById('cartPaidAmount');

            discountInput.addEventListener('input', calculateTotals);
            taxInput.addEventListener('input', calculateTotals);
            paidInput.addEventListener('input', calculateTotals);

            function filterItems() {
                const q = searchInput.value.toLowerCase().trim();
                const selectedCat = categoryFilter.value;
                const items = document.querySelectorAll('.product-item');

                items.forEach(item => {
                    const name = item.getAttribute('data-name').toLowerCase();
                    const sku = item.getAttribute('data-sku').toLowerCase();
                    const catId = item.getAttribute('data-category-id');

                    const matchesQuery = !q || name.includes(q) || sku.includes(q);
                    const matchesCategory = !selectedCat || catId === selectedCat;

                    item.style.display = (matchesQuery && matchesCategory) ? '' : 'none';
                });
            }

            searchInput.addEventListener('input', filterItems);
            categoryFilter.addEventListener('change', filterItems);

            // Barcode Enter key handler
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const visibleItems = document.querySelectorAll('.product-item:not([style*="display: none"])');
                    if (visibleItems.length === 1) {
                        addToCart(visibleItems[0]);
                        searchInput.value = '';
                        filterItems();
                    }
                }
            });
        });
    </script>

</div>
</body>
</html>
