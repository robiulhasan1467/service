<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: main-layout(~{::#brands-content}, 'Chocolate Brands', 'brands')}">
<body>
<div id="brands-content">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="h3 fw-bold text-dark mb-1">Chocolate Brands & Makers</h2>
            <p class="text-muted small mb-0">Manage premium manufacturers, Swiss chocolatiers, and in-house labels.</p>
        </div>
        <button type="button" class="btn btn-artisan" data-bs-toggle="modal" data-bs-target="#newBrandModal">
            <i class="bi bi-plus-circle me-1"></i> Add Brand
        </button>
    </div>

    <!-- Brands Table -->
    <div class="card border-0 shadow-sm p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Brand Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(brands)}">
                        <td colspan="5" class="text-center py-4 text-muted">No brands registered yet.</td>
                    </tr>
                    <tr th:each="br : ${brands}">
                        <td th:text="${br.id}">1</td>
                        <td><strong th:text="${br.name}">Lindt</strong></td>
                        <td class="text-muted" th:text="${br.description}">Description</td>
                        <td>
                            <span th:if="${br.status.name() == 'ACTIVE'}" class="badge bg-success">ACTIVE</span>
                            <span th:if="${br.status.name() == 'INACTIVE'}" class="badge bg-secondary">INACTIVE</span>
                        </td>
                        <td class="text-end">
                            <form th:action="@{'/brands/toggle/' + ${br.id}}" method="post" class="d-inline" onsubmit="return confirm('Toggle status for this brand?');">
                                <button type="submit" class="btn btn-sm" th:classappend="${br.status.name() == 'ACTIVE'} ? 'btn-outline-danger' : 'btn-outline-success'">
                                    <i th:class="${br.status.name() == 'ACTIVE'} ? 'bi bi-slash-circle' : 'bi bi-check-circle'"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Brand Modal -->
    <div class="modal fade" id="newBrandModal" tabindex="-1" aria-labelledby="newBrandModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/brands/save}" th:object="${newBrand}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="newBrandModalLabel">Add Chocolate Brand</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Brand Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Godiva, Valrhona, Neuhaus" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea th:field="*{description}" class="form-control" rows="2" placeholder="Origin, specialization..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-artisan">Save Brand</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
